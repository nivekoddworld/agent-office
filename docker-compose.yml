# Run agent-office in Docker. See README "Running in Docker".
#
#   docker compose run --rm agent-office office create my-office
#   OFFICE=my-office docker compose up -d
#   docker compose logs agent-office   # dashboard URL with login token

services:
  agent-office:
    build: .
    image: agent-office
    command: ["start", "--office", "${OFFICE:-default}"]
    ports:
      # Host and container port must match: the UI only accepts requests
      # from the origin it prints (http://127.0.0.1:<UI_PORT>).
      - "127.0.0.1:${UI_PORT:-3847}:${UI_PORT:-3847}"
    environment:
      UI_PORT: "${UI_PORT:-3847}"
    env_file:
      - path: .env
        required: false
    volumes:
      - agent-office-data:/home/node/.agent-office
    extra_hosts:
      # Lets agents reach llama.cpp / vLLM running on this machine (Linux).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  agent-office-data:
    name: agent-office-data
