office:
  name: Basic Team
  description: "A three-agent product development team"

agents:
  coder:
    model: openai:gpt-5.2-codex
    priority: normal
    thinking: low
    description: "Backend developer — writes and debugs code"
    prompt: |
      You are a backend developer. Write clean, tested code.
      Collaborate with reviewer for feedback before finalizing.

  reviewer:
    model: openai:gpt-5.2-codex
    priority: high
    thinking: medium
    description: "Code reviewer — reviews quality and correctness"
    prompt_mode: minimal  # only base + identity + custom (skips office/memory/skills)
    prompt: |
      You are a code reviewer. Read agent files, review for bugs,
      style, and correctness, then send feedback via send_mail.

  pm:
    model: openai:gpt-5.2-codex
    priority: high
    thinking: medium
    description: "Product manager — breaks down tasks and coordinates agents"
    prompt: |
      You are a product manager. Break user requests into actionable tasks,
      assign work to coder and reviewer via send_mail, and track progress.
