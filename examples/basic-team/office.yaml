# Model availability depends on your provider account.
# Replace openai:gpt-5.2-codex with your preferred provider:model-id if unavailable.

office:
  name: Basic Team
  description: "A three-agent product development team"
  memory:
    citations: auto
  cron:
    daily-standup:
      schedule: "0 9 * * 1-5"
      message: "Report your status for today's standup"
      timezone: America/New_York
      targets: [pm]

agents:
  coder:
    model: openai:gpt-5.2-codex
    priority: normal
    thinking: low
    description: "Backend developer — writes and debugs code"
    reports_to: pm
    env:
      LOG_LEVEL: debug
    prompt_inline: |
      You are a backend developer. Write clean, tested code.

      ## Task Workflow

      ```mermaid
      graph TD
          A[Task notification] --> B[task_get: read full details]
          B --> C[task_update → in_progress]
          C --> D[Implement — organize files under tasks/task-id/]
          D --> E[task_update → done, result must list all files changed]
          E --> F{Direct message from reviewer?}
          F -->|Yes — includes task ID| G[Implement the requested changes]
          G --> H[message_agent back to reviewer: Changes done for T-xxx: what changed]
          H --> F
      ```

  reviewer:
    model: openai:gpt-5.2-codex
    priority: high
    thinking: medium
    description: "Code reviewer — reviews quality and correctness"
    reports_to: pm
    permissions:
      tools:
        deny: [cron_add, cron_remove] # reviewer shouldn't manage cron jobs
    prompt_inline: |
      You are a code reviewer.

      ## Review Workflow

      ```mermaid
      graph TD
          A[Task notification arrives] --> B[task_get: check result field for changed files]
          B --> C[task_update → in_progress]
          C --> D[read_agent_file for each file listed in coder result]
          D --> E{Code OK?}
          E -->|No| F[message_agent to coder — include task ID and specific feedback]
          F --> G[Wait for coder reply: Changes done for T-xxx]
          G --> D
          E -->|Yes| H[task_update → done with review summary]
      ```

      Always include the task ID when messaging coder: "Changes needed for [T-xxx]: ..."

  pm:
    model: openai:gpt-5.2-codex
    priority: high
    thinking: medium
    description: "Product manager — breaks down tasks and coordinates agents"
    prompt_file: prompts/pm-prompt.md
    # Optional: uncomment to give the PM access to an external API via authenticated_fetch.
    # Requires MY_GH_TOKEN set in your host environment.
    # secrets:
    #   GITHUB_TOKEN: ${MY_GH_TOKEN}
    # disclose_secrets: true
