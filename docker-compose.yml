# Run agent-office in Docker. Setup: see README.md.
#
#   cp -r examples/local-team offices/my-office   # then edit its office.yaml
#   echo "OFFICE=my-office" > .env
#   docker compose up -d
#   docker compose logs agent-office | grep Dashboard

services:
  agent-office:
    build: .
    image: agent-office
    command: ["start", "--office", "${OFFICE:-}"]
    ports:
      # Host and container port must match: the UI only accepts requests
      # from the origin it prints (http://127.0.0.1:<UI_PORT>).
      - "127.0.0.1:${UI_PORT:-3847}:${UI_PORT:-3847}"
    environment:
      UI_PORT: "${UI_PORT:-3847}"
    env_file:
      - path: .env
        required: false
    volumes:
      # Your offices (config, agent workspaces, logs) live in ./offices.
      - ./offices:/home/node/.agent-office/offices
    extra_hosts:
      # Lets agents reach llama.cpp / vLLM running on this machine.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
